<svg xmlns="http://www.w3.org/2000/svg" width="704" height="522" viewBox="0 0 704 522"><defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#6c6ff5"/></marker></defs><rect x="40" y="30" width="300" height="92" rx="12" fill="#313244" stroke="#6c6ff5" stroke-width="3"/><text font-family="Segoe UI, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#cdd6f4" text-anchor="middle" dominant-baseline="middle"><tspan x="190" y="76">SPIRE Server</tspan></text><rect x="40" y="210" width="300" height="92" rx="12" fill="#313244" stroke="#6c6ff5" stroke-width="3"/><text font-family="Segoe UI, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#cdd6f4" text-anchor="middle" dominant-baseline="middle"><tspan x="190" y="256">SPIRE Agent</tspan></text><rect x="40" y="390" width="300" height="92" rx="12" fill="#313244" stroke="#6c6ff5" stroke-width="3"/><text font-family="Segoe UI, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#cdd6f4" text-anchor="middle" dominant-baseline="middle"><tspan x="190" y="421">Workload</tspan><tspan x="190" y="452">attestation</tspan></text><line x1="190" y1="126" x2="190" y2="204" stroke="#6c6ff5" stroke-width="3" marker-end="url(#ah)"/><line x1="190" y1="306" x2="190" y2="384" stroke="#6c6ff5" stroke-width="3" marker-end="url(#ah)"/><text font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#6c7086" text-anchor="start" dominant-baseline="middle"><tspan x="384" y="56">root of trust</tspan><tspan x="384" y="76">signs SVIDs · holds</tspan><tspan x="384" y="96">registration entries</tspan></text><text font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#6c7086" text-anchor="start" dominant-baseline="middle"><tspan x="384" y="236">one per node</tspan><tspan x="384" y="256">attests the node · runs</tspan><tspan x="384" y="276">the Workload API socket</tspan></text><text font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="normal" fill="#6c7086" text-anchor="start" dominant-baseline="middle"><tspan x="384" y="406">inspects the real caller</tspan><tspan x="384" y="426">(namespace, service account, uid)</tspan><tspan x="384" y="446">and issues only the SVID</tspan><tspan x="384" y="466">that matches a registered entry</tspan></text></svg>