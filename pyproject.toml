[project]
name = "spiffe-talk-demo"
version = "0.1.0"
description = "Demo for the talk 'Can I Trust You? Service-to-Service Identity with SPIFFE'"
requires-python = ">=3.10"
dependencies = [
    "spiffe>=0.3.0",
    "spiffe-tls>=0.4.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
whoami = "scripts.whoami:main"
omen = "scripts.omen:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
