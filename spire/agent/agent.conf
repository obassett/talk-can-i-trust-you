agent {
    data_dir           = "/opt/spire/data/agent"
    log_level          = "INFO"
    server_address     = "spire-server"
    server_port        = "8081"
    socket_path        = "/run/spire/sockets/api.sock"
    trust_domain       = "acme.internal"

    # Demo-only: trust the server's bundle on first contact. In production you
    # ship the trust bundle out-of-band instead.
    insecure_bootstrap = true
}

plugins {
    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "memory" {
        plugin_data {}
    }

    # Workload attestation: identify the calling container by its Docker labels.
    # Registration entries key off docker:label:com.docker.compose.service:<name>.
    WorkloadAttestor "docker" {
        plugin_data {}
    }
}
